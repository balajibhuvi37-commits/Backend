<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>

    
let num = 153;
let original = num;
let temp = num;
let count = 0;
let sum = 0;


while (temp > 0) {
    count++;
    temp = Math.floor(temp / 10);
}


temp = num;

while (temp > 0) {
    let digit = temp % 10;
    let power = 1;

    for (let i = 1; i <= count; i++) {
        power = power * digit;
    }

    sum = sum + power;
    temp = Math.floor(temp / 10);
}

if (sum === original) {
    console.log("Armstrong Number");
} else {
    console.log("Not an Armstrong Number");
}


    </script>
</body>
</html>
