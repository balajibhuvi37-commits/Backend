<!DOCTYPE html>
<html>
<head>
    <title>Promise Tasks</title>
</head>
<body>

    <h1>JavaScript Promise Tasks</h1>

    <!-- TASK 1 - PASS OR FAIL -->
    <h2>Task 1 - Pass or Fail</h2>

    <script>
        let mark = 75;

        const checkMark = () => {

            return new Promise((resolve, reject) => {

                if (mark >= 35) {
                    resolve("Student Passed");
                } else {
                    reject("Student Failed");
                }

            });

        };

        checkMark()
            .then(result => console.log(result))
            .catch(error => console.log(error));

    </script>


    <!-- TASK 2 - LOGIN VALIDATION -->
    <h2>Task 2 - Login Validation</h2>

    <script>
        let username = "admin";
        let password = "1234";

        const checkLogin = () => {

            return new Promise((resolve, reject) => {

                setTimeout(() => {

                    if (username === "admin" && password === "1234") {
                        resolve("Login Successful");
                    } else {
                        reject("Invalid Credentials");
                    }

                }, 2000);

            });

        };

        checkLogin()
            .then(result => console.log(result))
            .catch(error => console.log(error));

    </script>


    <!-- TASK 3 - PRODUCT PRICE -->
    <h2>Task 3 - Product Price Calculation</h2>

    <script>
        let price = 5000;

        const calculatePrice = () => {

            return new Promise((resolve, reject) => {

                if (price > 0) {

                    let discount = price * 10 / 100;
                    let finalPrice = price - discount;

                    resolve(finalPrice);

                } else {
                    reject("Invalid Product Price");
                }

            });

        };

        calculatePrice()
            .then(result => console.log("Discounted Price:", result))
            .catch(error => console.log(error))
            .finally(() => console.log("Calculation Completed"));

    </script>


    <!-- TASK 6 - FETCH USERS USING THEN -->
    <h2>Task 6 - Fetch Users Using Then</h2>

    <script>
        const getUsers = () => {

            fetch("https://jsonplaceholder.typicode.com/users")

                .then(response => {

                    if (!response.ok) {
                        throw new Error("API Error");
                    }

                    return response.json();

                })

                .then(users => {

                    users.forEach(user => {
                        console.log(user.name);
                    });

                })

                .catch(error => {
                    console.log("Error:", error.message);
                });

        };

        getUsers();

    </script>


    <!-- TASK 7 - FETCH USERS USING ASYNC AWAIT -->
    <h2>Task 7 - Fetch Users Using Async Await</h2>

    <script>
        const getAllUsers = async () => {

            try {

                const response = await fetch(
                    "https://jsonplaceholder.typicode.com/users"
                );

                if (!response.ok) {
                    throw new Error("API Error");
                }

                const users = await response.json();

                users.forEach(user => {

                    console.log("Name:", user.name);
                    console.log("Email:", user.email);
                    console.log("Phone:", user.phone);

                });

            } catch (error) {

                console.log("Error:", error.message);

            }

        };

        getAllUsers();

    </script>


    <!-- TASK 8 - FETCH SINGLE PRODUCT -->
    <h2>Task 8 - Fetch Single Product</h2>

    <script>
        const getProduct = async () => {

            try {

                const response = await fetch(
                    "https://dummyjson.com/products/1"
                );

                if (!response.ok) {
                    throw new Error("Product API Error");
                }

                const product = await response.json();

                console.log("Title:", product.title);
                console.log("Price:", product.price);
                console.log("Category:", product.category);

            } catch (error) {

                console.log("Error:", error.message);

            }

        };

        getProduct();

    </script>

</body>
</html>
